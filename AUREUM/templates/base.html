<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="AUREUM, plataforma tecnológica para la gestión integral de SOFOMES.">

    <title>
        {% block title %}
            AUREUM
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_css %}
    {% endblock %}

</head>


<body class="d-flex flex-column min-vh-100 bg-light">


<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">

    <div class="container">

        <!-- MARCA -->
        <a class="navbar-brand fw-bold"
           href="/home/">
            AUREUM
        </a>


        <!-- MOBILE -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Mostrar navegación"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <!-- NAVEGACIÓN -->
        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                <li class="nav-item">

                    <a
                        class="nav-link
                        {% if request.path == '/home/' %}
                            active fw-semibold
                        {% endif %}"
                        href="/home/"
                    >
                        Inicio
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link
                        {% if request.path == '/about/' %}
                            active fw-semibold
                        {% endif %}"
                        href="/about/"
                    >
                        Nosotros
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link
                        {% if request.path == '/login/' %}
                            active fw-semibold
                        {% endif %}"
                        href="/login/"
                    >
                        Iniciar sesión
                    </a>

                </li>


                <li class="nav-item ms-lg-2 mt-2 mt-lg-0">

                    <a
                        class="btn btn-primary px-4"
                        href="/sofom/register/"
                    >
                        Solicitar acceso
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CONTENIDO -->
<main class="flex-grow-1">

    {% block content %}
    {% endblock %}

</main>


<!-- FOOTER -->
<footer class="bg-white border-top mt-auto">

    <div class="container py-4">

        <div class="row align-items-center gy-3">

            <div class="col-md-6 text-center text-md-start">

                <p class="fw-semibold mb-1">
                    AUREUM
                </p>

                <small class="text-muted">
                    Gestión tecnológica para instituciones financieras
                </small>

            </div>


            <div class="col-md-6 text-center text-md-end">

                <small class="text-muted">
                    © {% now "Y" %} AUREUM
                </small>

                <span class="text-muted mx-2">
                    ·
                </span>

                <a
                    href="/about/"
                    class="small text-decoration-none text-muted"
                >
                    Nosotros
                </a>

            </div>

        </div>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

{% block extra_js %}
{% endblock %}

</body>

</html>
